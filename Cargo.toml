[package]
name = "acrudjson"
version = "0.2.0"
description = "Atomic CRUD and arbitrary-precision decimal arithmetic over JSON-RPC 1.0 and 2.0, backed by redb."
authors = ["Sheldon Knuth <sheldon@abackbone.net>"]
repository = "https://github.com/sheruost/acrudjson"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["json-rpc", "jsonrpc", "bigdecimal", "redb", "crud"]
categories = ["network-programming", "database", "mathematics"]
edition = "2024"
exclude = [".github"]

[features]
default = ["std"]
## Store on redb. Without it the crate is `no_std` + `alloc`.
std = ["dep:redb", "bigdecimal/std", "serde/std", "serde_json/std"]
## Async UDP and TCP servers built on tokio.
tokio = ["std", "dep:tokio"]

[dependencies]
bigdecimal = { version = "0.4.7", default-features = false }
redb = { version = "4", optional = true }
serde = { version = "1.0.194", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.134", default-features = false, features = ["alloc", "raw_value"] }
tokio = { version = "1.22", optional = true, features = ["net", "io-util", "rt", "rt-multi-thread"] }

[dev-dependencies]
serde = "1.0.194"
tokio = { version = "1.22", features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "rpc"
required-features = ["std"]

[[test]]
name = "ergonomics"
required-features = ["std"]

[[example]]
name = "server"
required-features = ["tokio"]

[[example]]
name = "client"
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true
rustc-args = ["-Zpolonius=next"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
